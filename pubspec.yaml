name: anishka
description: "anishka — аниме без лишнего. кроссплатформенный клиент."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.7
  flutter_cache_manager: ^3.5.0
  go_router: ^18.1.4
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  html: ^0.15.6
  xml: ^6.5.0
  url_launcher: ^6.3.2
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # локальная копия с патчем для linux, см. third_party/media_kit/PATCHES.md
  media_kit:
    path: third_party/media_kit

flutter:
  uses-material-design: true
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-400.ttf
          weight: 400
        - asset: assets/fonts/Unbounded-500.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-600.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-700.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-800.ttf
          weight: 800
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
        - asset: assets/fonts/Onest-800.ttf
          weight: 800
